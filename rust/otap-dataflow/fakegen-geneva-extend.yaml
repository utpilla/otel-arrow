# Geneva Exporter with Transform Processor (extend with constant)
#
# Same as fakegen-geneva.yaml, but inserts a transform processor between the
# fake-data-generator and the geneva-exporter that overwrites ONE existing
# attribute on every log record with a constant value:
#
#     attributes["code.namespace"] = "myapp.handler"
#
# `code.namespace` is one of the 50 attributes the generator already emits, so
# this overwrite keeps the column count at 50 (no schema change). It is the
# canonical "Arrow wins" demo: the column becomes a single-entry dictionary
# with one value ("myapp.handler") and an indices array pointing to that one
# entry, so the additional cost is O(1) per batch regardless of how many
# records the batch contains.
#
# (Note: an earlier version of this YAML added a NEW attribute
# `deployment.env`, but Geneva returned HTTP 414 because the schema URL grew
# too long when 51 columns were registered. Overwriting an existing column
# avoids that.)
#
# Use this together with fakegen-geneva.yaml (and optionally
# fakegen-geneva-transform.yaml) for an A/B/C comparison of the transform
# processor's per-record CPU cost across operations of varying difficulty:
#
#   .\target\release\df_engine.exe --config fakegen-geneva.yaml            --num-cores 1 --run-duration-secs 120
#   .\target\release\df_engine.exe --config fakegen-geneva-transform.yaml  --num-cores 1 --run-duration-secs 120
#   .\target\release\df_engine.exe --config fakegen-geneva-extend.yaml     --num-cores 1 --run-duration-secs 120
#
# Diff the `cpu_time per record` lines from each run summary. The expected
# story is that this YAML's overhead is near-zero compared to the baseline,
# while fakegen-geneva-transform.yaml (50 renames) shows a measurable but
# still small CPU bump.
#
# Records produced by THIS YAML carry `event_name = "Test3"` so they're easy
# to distinguish from the baseline (`Test1`) and rename (`Test2`) runs in
# Geneva.

version: otel_dataflow/v1

policies:
  channel_capacity:
    control:
      node: 100
      pipeline: 100
    pdata: 128

engine:
  telemetry:
    logs:
      level: "info,otap-df-contrib-nodes=info"

groups:
  default:
    pipelines:
      main:
        nodes:
          # Built-in fake data generator producing logs only.
          # 50 attributes per record — see docs/fakegen-log-columns.md.
          fake-data-generator:
            type: "urn:otel:receiver:traffic_generator"
            config:
              data_source: static
              generation_strategy: pre_generated
              traffic_config:
                # Same cap as fakegen-geneva.yaml so the A/B/C comparison has
                # identical denominators on all sides.
                signals_per_second: 1000
                max_batch_size: 1000
                max_signal_count: null
                num_log_attributes: 50
                log_event_name: "Test3"
                metric_weight: 0
                trace_weight: 0
                log_weight: 1

          # Transform processor: overwrite ONE existing attribute with a
          # constant value. Arrow stores the resulting column as a single-entry
          # dictionary, so per-record cost is near-zero, and the schema
          # (column count) is unchanged.
          extend-attr:
            type: "urn:otel:processor:transform"
            config:
              kql_query: |
                logs | extend attributes["code.namespace"] = "myapp.handler"

          # Geneva exporter (same config as fakegen-geneva.yaml).
          geneva-exporter:
            type: "urn:microsoft:exporter:geneva"
            config:
              endpoint: "https://gcs.ppe.monitoring.core.windows.net"
              environment: "Test"
              account: "PipelineAgent2Demo"
              namespace: "PAdemo2"
              region: "eastus"
              config_major_version: 2
              tenant: "PAdemo2-tenant"
              role_name: "otlp-collector"
              role_instance: "collector-001"

              auth:
                type: "certificate"
                path: "C:/Users/utpilla/Downloads/client.p12"
                password: "password"

              max_buffer_size: 1000
              max_concurrent_uploads: 4

        connections:
          - from: fake-data-generator
            to: extend-attr
          - from: extend-attr
            to: geneva-exporter
